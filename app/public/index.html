<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applio API Console</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Applio FastAPI Console</h1>
      <p>REST API를 바로 호출할 수 있는 최소한의 정적 페이지입니다.</p>
    </header>

    <section class="health">
      <div class="quick-actions">
        <button id="health-btn">헬스체크</button>
        <button id="models-btn">모델 리스트</button>
        <button id="outputs-btn">추론 결과</button>
      </div>
      <div id="health-result" class="result">클릭하여 상태 확인</div>
    </section>

    <div class="grid">
      <section>
        <h2>학습 (Train)</h2>
        <form id="train-upload-form" enctype="multipart/form-data">
          <label>
            샘플레이트 (선택)
            <input
              name="sample_rate"
              type="number"
              min="16000"
              max="48000"
              placeholder="기본 40000"
            />
          </label>
          <label>
            총 Epoch (선택)
            <input
              name="total_epoch"
              type="number"
              min="1"
              max="1000"
              placeholder="기본 200"
            />
          </label>
          <label>
            배치 크기 (선택)
            <input
              name="batch_size"
              type="number"
              min="1"
              max="32"
              placeholder="기본 4"
            />
          </label>
          <label>
            Embedder Model (선택)
            <input
              name="embedder_model"
              placeholder="contentvec 또는 spin-v2 (기본: contentvec)"
              autocomplete="off"
            />
          </label>
          <label>
            학습용 음성 파일들 (mp3/wav, 다중 선택 가능)
            <input
              name="files"
              type="file"
              accept=".wav,.mp3,.flac,.m4a"
              multiple
              required
            />
          </label>
          <button type="submit">파일로 학습 시작</button>
        </form>
        <div id="train-upload-result" class="result"></div>
      </section>

      <section>
        <h2>추론 (Inference)</h2>
        <form id="inference-upload-form" enctype="multipart/form-data">
          <label>
            입력 오디오 파일
            <input
              name="target_audio"
              type="file"
              accept=".wav,.mp3,.flac,.m4a"
              required
            />
          </label>
          <div class="model-select-group">
            <label>
              모델 선택
              <select name="model_select" id="model-select" required>
                <option value="">모델을 선택하세요</option>
              </select>
            </label>
            <label>
              모델 파일 (.pth)
              <input
                name="model_path"
                id="model-path-input"
                placeholder="자동 선택 또는 직접 입력"
                autocomplete="off"
              />
            </label>
          </div>
          <div class="model-select-group">
            <label>
              인덱스 파일 선택
              <select name="index_select" id="index-select">
                <option value="">인덱스 파일 없음</option>
              </select>
            </label>
            <label>
              인덱스 경로 (.index, 선택)
              <input
                name="index_path"
                id="index-path-input"
                placeholder="자동 선택 또는 직접 입력"
                autocomplete="off"
              />
            </label>
          </div>
          <label>
            출력 디렉토리 (선택)
            <input name="output_dir" placeholder="outputs" />
          </label>
          <label>
            Volume Envelope (선택)
            <input
              name="volume_envelope"
              type="number"
              step="0.1"
              placeholder="기본 1.0"
            />
          </label>
          <label>
            Protect (선택)
            <input
              name="protect"
              type="number"
              step="0.1"
              placeholder="기본 0.5"
            />
          </label>
          <label>
            F0 Autotune (선택)
            <input name="f0_autotune" type="checkbox" />
          </label>
          <label>
            Embedder Model (선택)
            <input
              name="embedder_model"
              placeholder="contentvec 또는 spin-v2 (기본: contentvec)"
              autocomplete="off"
            />
          </label>
          <button type="submit">파일로 추론 실행</button>
        </form>
        <div id="inference-upload-result" class="result"></div>
      </section>
    </div>

    <section class="job-status">
      <h3>작업 상태 조회</h3>
      <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
        <label style="margin: 0;">
          큐 선택
          <select name="queue_name" id="queue-select" required>
            <option value="train">train</option>
            <option value="inference">inference</option>
          </select>
        </label>
        <button id="jobs-refresh-btn" style="margin: 0;">새로고침</button>
        <div class="auto-refresh" style="margin: 0;">
          <input type="checkbox" id="auto-refresh-checkbox" />
          <label for="auto-refresh-checkbox" style="margin: 0; cursor: pointer">
            자동 새로고침 (5초마다)
          </label>
        </div>
      </div>
      <div id="jobs-list-container">
        <div id="job-status-result" class="result">
          큐를 선택하고 새로고침 버튼을 클릭하세요
        </div>
      </div>
    </section>

    <section class="job-status">
      <h3>모델 관리</h3>
      <button id="models-refresh-btn" style="margin-bottom: 1rem">새로고침</button>
      <div id="models-list-container">
        <div id="models-list" class="result">
          모델 리스트 조회 버튼을 클릭하세요
        </div>
      </div>
      <div style="margin-top: 1rem">
        <label>
          삭제할 모델 ID
          <input
            id="delete-model-id"
            placeholder="모델 ID를 입력하세요"
            autocomplete="off"
          />
        </label>
        <button id="delete-model-btn" style="margin-top: 0.5rem">
          모델 삭제
        </button>
      </div>
    </section>

    <section class="job-status">
      <h3>추론 결과 관리</h3>
      <button id="outputs-refresh-btn" style="margin-bottom: 1rem">새로고침</button>
      <div id="outputs-list-container">
        <div id="outputs-list" class="result">
          추론 결과 조회 버튼을 클릭하세요
        </div>
      </div>
      <div style="margin-top: 1rem">
        <label>
          삭제할 출력 파일 ID (파일명)
          <input
            id="delete-output-id"
            placeholder="출력 파일 ID를 입력하세요"
            autocomplete="off"
          />
        </label>
        <button id="delete-output-btn" style="margin-top: 0.5rem">
          출력 파일 삭제
        </button>
      </div>
    </section>

    <script type="module" src="/static/main.js"></script>
  </body>
</html>
