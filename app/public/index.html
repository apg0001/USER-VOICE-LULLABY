<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎤 Applio API Console</title>
    <style>
      :root {
        --bg-primary: #0a0e15;
        --bg-secondary: #141b24;
        --bg-card: #1a2230;
        --accent-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --accent-success: #10b981;
        --accent-warning: #f59e0b;
        --accent-danger: #ef4444;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --border: #334155;
        --glass: rgba(255, 255, 255, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", -apple-system, sans-serif;
        background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f2e 100%);
        color: var(--text-primary);
        min-height: 100vh;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }

      .header {
        text-align: center;
        margin-bottom: 3rem;
      }

      .header h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        background: var(--accent-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
        font-weight: 800;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
        margin-bottom: 3rem;
      }

      .status-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .status-card:hover {
        border-color: #4b5e77;
        transform: translateY(-2px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .status-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .status-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: bold;
      }

      .health-ok {
        background: linear-gradient(135deg, var(--accent-success), #059669);
      }
      .models {
        background: linear-gradient(135deg, #f59e0b, #d97706);
      }
      .outputs {
        background: linear-gradient(135deg, #06b6d4, #0891b2);
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      .form-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2rem;
        backdrop-filter: blur(20px);
      }

      .form-card h2 {
        margin: 0 0 1.5rem 0;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      @media (max-width: 768px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
      }

      input,
      select {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--glass);
        color: var(--text-primary);
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #4b5e77;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .file-input {
        padding: 0.75rem;
        border: 2px dashed var(--border);
        border-radius: 12px;
        background: var(--glass);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .file-input:hover {
        border-color: #4b5e77;
        background: rgba(255, 255, 255, 0.08);
      }

      .file-input.dragover {
        border-color: #667eea;
        background: rgba(102, 126, 234, 0.1);
      }

      .btn {
        background: var(--accent-primary);
        border: none;
        border-radius: 12px;
        padding: 0.875rem 1.5rem;
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
        margin-top: 0.5rem;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        line-height: 1.5;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 1rem;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .status-bar {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
      }

      .status-badge {
        padding: 0.4rem 1rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .badge-running {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .badge-success {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }
      .badge-error {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent-primary);
        transition: width 0.3s ease;
      }

      .job-list {
        margin-top: 1.5rem;
      }

      .job-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        margin-bottom: 0.75rem;
        border-left: 4px solid transparent;
      }

      .job-item.running {
        border-left-color: #f59e0b;
      }
      .job-item.success {
        border-left-color: #10b981;
      }
      .job-item.error {
        border-left-color: #ef4444;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .pulse {
        animation: pulse 2s infinite;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>🎤 Applio API Console</h1>
        <p>MRF HiFi-GAN 실시간 학습 & 추론 모니터링</p>
      </header>

      <!-- 상태 대시보드 -->
      <div class="status-grid">
        <div class="status-card">
          <div class="status-header">
            <div class="status-icon health-ok">✓</div>
            <div>
              <h3>서비스 상태</h3>
              <div id="health-status">확인 중...</div>
            </div>
          </div>
          <button class="btn" onclick="checkHealth()">헬스체크 새로고침</button>
          <div id="health-result" class="result"></div>
        </div>

        <div class="status-card">
          <div class="status-header">
            <div class="status-icon models">📦</div>
            <div>
              <h3>모델 목록</h3>
              <div id="models-count">0개</div>
            </div>
          </div>
          <button class="btn" onclick="loadModels()">모델 새로고침</button>
          <div id="models-list" class="result"></div>
        </div>

        <div class="status-card">
          <div class="status-header">
            <div class="status-icon outputs">🎵</div>
            <div>
              <h3>출력 파일</h3>
              <div id="outputs-count">0개</div>
            </div>
          </div>
          <button class="btn" onclick="loadOutputs()">출력 새로고침</button>
          <div id="outputs-list" class="result"></div>
        </div>
      </div>

      <!-- 주요 기능 그리드 -->
      <div class="main-grid">
        <!-- 학습 폼 -->
        <div class="form-card">
          <h2>🚀 모델 학습 시작</h2>
          <form id="train-form" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group">
                <label>총 Epoch</label>
                <input
                  name="total_epoch"
                  type="number"
                  min="10"
                  max="500"
                  placeholder="200"
                  value="200"
                />
              </div>
              <div class="form-group">
                <label>배치 크기</label>
                <input
                  name="batch_size"
                  type="number"
                  min="1"
                  max="16"
                  placeholder="4"
                  value="4"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Embedder</label>
                <select name="embedder_model">
                  <option value="contentvec">contentvec</option>
                  <option value="spin-v2">spin-v2 (노래 추천)</option>
                </select>
              </div>
              <div class="form-group">
                <label>샘플레이트</label>
                <input
                  name="sample_rate"
                  type="number"
                  min="16000"
                  max="48000"
                  placeholder="40000"
                  value="40000"
                />
              </div>
            </div>

            <div class="form-group">
              <label>
                🎵 학습 음성 파일 (mp3/wav, 최대 30분)
                <div class="file-input-wrapper">
                  <div class="file-input" id="train-file-drop">
                    파일 드래그 또는 클릭
                  </div>
                  <input
                    class="file-input"
                    name="files"
                    type="file"
                    accept=".wav,.mp3,.flac,.m4a"
                    multiple
                    required
                  />
                </div>
              </label>
            </div>

            <button type="submit" class="btn">학습 시작</button>
          </form>
          <div id="train-result" class="result"></div>
          <div class="status-bar">
            <div class="status-badge badge-running" id="train-status">
              대기중
            </div>
            <div class="progress-bar">
              <div
                class="progress-fill"
                id="train-progress"
                style="width: 0%"
              ></div>
            </div>
          </div>
        </div>

        <!-- 추론 폼 -->
        <div class="form-card">
          <h2>🎙️ 실시간 추론</h2>
          <form id="inference-form" enctype="multipart/form-data">
            <div class="form-group">
              <label>🎵 입력 노래</label>
              <div class="file-input-wrapper">
                <div class="file-input" id="audio-file-drop">
                  노래 파일 드래그
                </div>
                <input
                  class="file-input"
                  name="target_audio"
                  type="file"
                  accept=".wav,.mp3"
                  required
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>모델 경로</label>
                <input
                  name="model_path"
                  placeholder="logs/kgs-spin-v2_105e_9870s_best_epoch.pth"
                  required
                />
              </div>
              <div class="form-group">
                <label>인덱스 (선택)</label>
                <input
                  name="index_path"
                  placeholder="logs/kgs-spin-v2/added_IVF.index"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Volume Envelope</label>
                <input
                  name="volume_envelope"
                  type="number"
                  step="0.1"
                  min="0"
                  max="2"
                  value="1.0"
                />
              </div>
              <div class="form-group">
                <label>Protect</label>
                <input
                  name="protect"
                  type="number"
                  step="0.1"
                  min="0"
                  max="1"
                  value="0.33"
                />
              </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 1rem">
              <label style="flex: 1">
                <input type="checkbox" name="f0_autotune" /> F0 Autotune
              </label>
              <label style="flex: 1">
                Embedder:
                <select name="embedder_model" style="width: 100%">
                  <option value="contentvec">contentvec</option>
                  <option value="spin-v2">spin-v2</option>
                </select>
              </label>
            </div>

            <button type="submit" class="btn">추론 실행</button>
          </form>
          <div id="inference-result" class="result"></div>
          <div class="status-bar">
            <div class="status-badge badge-running" id="inference-status">
              대기중
            </div>
          </div>
        </div>
      </div>

      <!-- 작업 목록 -->
      <div class="form-card">
        <h2>📋 최근 작업 목록</h2>
        <div class="job-list" id="job-list">
          <div class="job-item">
            <span>대기중... 새로고침하세요</span>
            <button class="btn" style="width: auto; padding: 0.5rem 1rem">
              새로고침
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 상태 관리
      const API_BASE = "/api";

      // 헬스체크
      async function checkHealth() {
        try {
          const res = await fetch(`${API_BASE}/health`);
          const data = await res.json();
          document.getElementById("health-status").textContent = "✅ 정상";
          document.getElementById("health-result").textContent = JSON.stringify(
            data,
            null,
            2
          );
        } catch (e) {
          document.getElementById("health-status").textContent = "❌ 오류";
          document.getElementById(
            "health-result"
          ).textContent = `오류: ${e.message}`;
        }
      }

      // 폼 핸들러
      document
        .getElementById("train-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          await submitForm("train", formData, "train");
        });

      document
        .getElementById("inference-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          await submitForm("inference", formData, "inference");
        });

      async function submitForm(endpoint, formData, type) {
        const resultEl = document.getElementById(type + "-result");
        const statusEl = document.getElementById(type + "-status");
        const progressEl = document.getElementById(type + "-progress");

        statusEl.textContent = "⏳ 처리중...";
        statusEl.className = "status-badge badge-running pulse";

        try {
          const res = await fetch(`${API_BASE}/${endpoint}`, {
            method: "POST",
            body: formData,
          });

          const data = await res.json();
          resultEl.textContent = JSON.stringify(data, null, 2);

          if (data.status === "success") {
            statusEl.textContent = "✅ 완료";
            statusEl.className = "status-badge badge-success";
            progressEl.style.width = "100%";
          } else {
            statusEl.textContent = "❌ 실패";
            statusEl.className = "status-badge badge-error";
          }
        } catch (e) {
          resultEl.textContent = `오류: ${e.message}`;
          statusEl.textContent = "❌ 오류";
          statusEl.className = "status-badge badge-error";
        }
      }

      // 드래그 앤 드롭
      ["train-file-drop", "audio-file-drop"].forEach((id) => {
        const dropZone = document.getElementById(id);
        const fileInput = dropZone.nextElementSibling;

        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
          dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropZone.classList.remove("dragover");
          fileInput.files = e.dataTransfer.files;
        });

        dropZone.addEventListener("click", () => fileInput.click());
      });

      // 초기 로드
      checkHealth();
      setInterval(checkHealth, 10000);
    </script>
  </body>
</html>
