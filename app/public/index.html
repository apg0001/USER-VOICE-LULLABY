<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applio API Console</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0b0d12;
        color: #f7f8fc;
      }
      body {
        margin: 0;
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      h1,
      h2,
      h3 {
        margin-top: 0;
      }
      .header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #1f2532;
      }
      .quick-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 2rem;
      }
      .quick-actions button {
        flex: 1;
        min-width: 150px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      form {
        background: #141820;
        border: 1px solid #1f2532;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        gap: 0.4rem;
        margin-bottom: 1rem;
      }
      input,
      select {
        padding: 0.6rem 0.8rem;
        border-radius: 8px;
        border: 1px solid #2c3547;
        background: #0b0f16;
        color: inherit;
        font-size: 0.9rem;
      }
      select {
        cursor: pointer;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.95rem;
        cursor: pointer;
        background: linear-gradient(120deg, #6366f1, #14b8a6);
        color: white;
        transition: opacity 0.2s;
        font-weight: 500;
      }
      button:hover {
        opacity: 0.9;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .result {
        background: #0f131b;
        border-radius: 10px;
        padding: 1rem;
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 0.85rem;
        overflow-x: auto;
        border: 1px solid #202635;
        min-height: 80px;
        white-space: pre-wrap;
        margin-top: 1rem;
      }
      .health {
        margin-bottom: 2rem;
      }
      .job-status {
        background: #141820;
        border: 1px solid #1f2532;
        border-radius: 12px;
        padding: 1.5rem;
        margin-top: 1.5rem;
      }
      .job-status h3 {
        margin-top: 0;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-left: 0.5rem;
      }
      .status-pending {
        background: #3b82f6;
        color: white;
      }
      .status-running {
        background: #f59e0b;
        color: white;
      }
      .status-completed {
        background: #10b981;
        color: white;
      }
      .status-failed {
        background: #ef4444;
        color: white;
      }
      .auto-refresh {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .auto-refresh input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      /* 모델/출력 리스트 테이블 스타일 */
      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        background: #0f131b;
        border-radius: 8px;
        overflow: hidden;
      }
      .data-table th,
      .data-table td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid #1f2532;
      }
      .data-table th {
        background: #141820;
        font-weight: 600;
        color: #a0aec0;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .data-table tr:hover {
        background: #1a1f2e;
      }
      .data-table tr:last-child td {
        border-bottom: none;
      }
      .file-link {
        color: #60a5fa;
        cursor: pointer;
        text-decoration: underline;
        transition: color 0.2s;
      }
      .file-link:hover {
        color: #93c5fd;
      }
      .file-actions {
        display: flex;
        gap: 0.5rem;
      }
      .file-actions button {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        background: #2c3547;
        border: 1px solid #3b4555;
      }
      .file-actions button:hover {
        background: #3b4555;
      }
      .file-actions button[style*="background: #ef4444"] {
        background: #ef4444 !important;
        border-color: #dc2626;
      }
      .file-actions button[style*="background: #ef4444"]:hover {
        background: #dc2626 !important;
      }
      .model-select-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .empty-state {
        text-align: center;
        padding: 2rem;
        color: #6b7280;
        font-style: italic;
      }
      .audio-player {
        margin-top: 0.5rem;
        width: 100%;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h1>Applio FastAPI Console</h1>
      <p>REST API를 바로 호출할 수 있는 최소한의 정적 페이지입니다.</p>
    </header>

    <section class="health">
      <div class="quick-actions">
        <button id="health-btn">헬스체크</button>
        <button id="models-btn">모델 리스트</button>
        <button id="outputs-btn">추론 결과</button>
      </div>
      <div id="health-result" class="result">클릭하여 상태 확인</div>
    </section>

    <div class="grid">
      <section>
        <h2>학습 (Train)</h2>
        <form id="train-upload-form" enctype="multipart/form-data">
          <label>
            샘플레이트 (선택)
            <input
              name="sample_rate"
              type="number"
              min="16000"
              max="48000"
              placeholder="기본 40000"
            />
          </label>
          <label>
            총 Epoch (선택)
            <input
              name="total_epoch"
              type="number"
              min="1"
              max="1000"
              placeholder="기본 200"
            />
          </label>
          <label>
            배치 크기 (선택)
            <input
              name="batch_size"
              type="number"
              min="1"
              max="32"
              placeholder="기본 4"
            />
          </label>
          <label>
            Embedder Model (선택)
            <input
              name="embedder_model"
              placeholder="contentvec 또는 spin-v2 (기본: contentvec)"
              autocomplete="off"
            />
          </label>
          <label>
            학습용 음성 파일들 (mp3/wav, 다중 선택 가능)
            <input
              name="files"
              type="file"
              accept=".wav,.mp3,.flac,.m4a"
              multiple
              required
            />
          </label>
          <button type="submit">파일로 학습 시작</button>
        </form>
        <div id="train-upload-result" class="result"></div>
      </section>

      <section>
        <h2>추론 (Inference)</h2>
        <form id="inference-upload-form" enctype="multipart/form-data">
          <label>
            입력 오디오 파일
            <input
              name="target_audio"
              type="file"
              accept=".wav,.mp3,.flac,.m4a"
              required
            />
          </label>
          <div class="model-select-group">
            <label>
              모델 선택
              <select name="model_select" id="model-select" required>
                <option value="">모델을 선택하세요</option>
              </select>
            </label>
            <label>
              모델 파일 (.pth)
              <input
                name="model_path"
                id="model-path-input"
                placeholder="자동 선택 또는 직접 입력"
                autocomplete="off"
              />
            </label>
          </div>
          <div class="model-select-group">
            <label>
              인덱스 파일 선택
              <select name="index_select" id="index-select">
                <option value="">인덱스 파일 없음</option>
              </select>
            </label>
            <label>
              인덱스 경로 (.index, 선택)
              <input
                name="index_path"
                id="index-path-input"
                placeholder="자동 선택 또는 직접 입력"
                autocomplete="off"
              />
            </label>
          </div>
          <label>
            출력 디렉토리 (선택)
            <input name="output_dir" placeholder="outputs" />
          </label>
          <label>
            Volume Envelope (선택)
            <input
              name="volume_envelope"
              type="number"
              step="0.1"
              placeholder="기본 1.0"
            />
          </label>
          <label>
            Protect (선택)
            <input
              name="protect"
              type="number"
              step="0.1"
              placeholder="기본 0.5"
            />
          </label>
          <label>
            F0 Autotune (선택)
            <input name="f0_autotune" type="checkbox" />
          </label>
          <label>
            Embedder Model (선택)
            <input
              name="embedder_model"
              placeholder="contentvec 또는 spin-v2 (기본: contentvec)"
              autocomplete="off"
            />
          </label>
          <button type="submit">파일로 추론 실행</button>
        </form>
        <div id="inference-upload-result" class="result"></div>
      </section>
    </div>

    <section class="job-status">
      <h3>작업 상태 조회</h3>
      <form id="job-status-form">
        <label>
          큐 이름
          <select name="queue_name" required>
            <option value="train">train</option>
            <option value="inference">inference</option>
          </select>
        </label>
        <label>
          Job ID
          <input
            name="job_id"
            placeholder="작업 ID를 입력하세요"
            required
            autocomplete="off"
          />
        </label>
        <button type="submit">상태 조회</button>
      </form>
      <div class="auto-refresh">
        <input type="checkbox" id="auto-refresh-checkbox" />
        <label for="auto-refresh-checkbox" style="margin: 0; cursor: pointer">
          자동 새로고침 (5초마다)
        </label>
      </div>
      <div id="job-status-result" class="result">
        작업 ID를 입력하고 조회하세요
      </div>
    </section>

    <section class="job-status">
      <h3>모델 관리</h3>
      <button id="models-refresh-btn" style="margin-bottom: 1rem">새로고침</button>
      <div id="models-list-container">
        <div id="models-list" class="result">
          모델 리스트 조회 버튼을 클릭하세요
        </div>
      </div>
      <div style="margin-top: 1rem">
        <label>
          삭제할 모델 ID
          <input
            id="delete-model-id"
            placeholder="모델 ID를 입력하세요"
            autocomplete="off"
          />
        </label>
        <button id="delete-model-btn" style="margin-top: 0.5rem">
          모델 삭제
        </button>
      </div>
    </section>

    <section class="job-status">
      <h3>추론 결과 관리</h3>
      <button id="outputs-refresh-btn" style="margin-bottom: 1rem">새로고침</button>
      <div id="outputs-list-container">
        <div id="outputs-list" class="result">
          추론 결과 조회 버튼을 클릭하세요
        </div>
      </div>
      <div style="margin-top: 1rem">
        <label>
          삭제할 출력 파일 ID (파일명)
          <input
            id="delete-output-id"
            placeholder="출력 파일 ID를 입력하세요"
            autocomplete="off"
          />
        </label>
        <button id="delete-output-btn" style="margin-top: 0.5rem">
          출력 파일 삭제
        </button>
      </div>
    </section>

    <script type="module" src="/static/main.js"></script>
  </body>
</html>
